<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeline</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: antiquewhite;
        }
        table {
            & thead {
                position: sticky;
                top: 0;
                background-color: khaki;
                & label {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: smaller;
                    font-weight: lighter;
                }
            }
            & tfoot {
                position: sticky;
                bottom: 0;
            }
        }
        .tooltip {
            cursor: default;
            user-select: none;
            white-space: nowrap;
        }
        .tooltiptext {
            visibility: hidden;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            margin: -30px 0px 0px 115px;
            font-size: small;
            display: grid;
            grid-template-columns: auto auto;
            > div:nth-child(odd) {
                text-align: right;
                white-space: nowrap;
            }
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
        }
        td:nth-child(1) {
            text-transform: lowercase;
            &::first-letter {
                text-transform: uppercase;
            }
        }
        td:nth-child(2) {
            text-transform: capitalize;
        }
    </style>
    <script src="data.js"></script>
</head>
<body>
    <form oninput="redraw(this)">
        <table border="1" cellpadding="10" cellspacing="2" width="100%">
            <thead>
                <tr>
                    <th>
                        Type<br>
                        <select name="eventtype">
                            <option value="all">All Events</option>
                        </select>
                    </th>
                    <th width="200">
                        Event<label><input name="recent" type="checkbox">Recent</label>
                    </th>
                    <th width="100">
                        Age<br>
                        <select name="units">
                            <option value="0">Auto</option>
                            <option value="1000000000">Billion</option>
                            <option value="10000000">Crore</option>
                            <option value="1000000">Million</option>
                            <option value="100000">Lakh</option>
                            <option value="1000">Millennium</option>
                            <option value="100">Century</option>
                            <option value="1">Years</option>
                        </select>
                        <label><input name="reverse" type="checkbox">Reverse</label>
                    </th>
                    <th>Year Start</th>
                    <th>Year End</th>
                    <th>Description<label><input name="search" type="search" placeholder="search"></label></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="6">Footer</a></td>
                </tr>
            </tfoot>
        </table>
    </form>
    <script>

        [...new Set(data.map(item => item.type.toLowerCase()))].forEach(type => document.querySelector('select[name="eventtype"]').insertAdjacentHTML('beforeend', `<option value="${type}">${type.charAt(0).toUpperCase() + type.slice(1)}</option>`));    

        function redraw(form) {
            const fData = new FormData(form);
            const fromEntries = Array.from(fData);
            const formObject = Object.fromEntries(fromEntries);
            console.log(formObject)
            const searchValue = form.search.value.toLowerCase();
            const unitValue = parseInt(form.units.value);
            const unitText = form.units.options[form.units.selectedIndex].text;
            const typeValue = form.eventtype.value;
            const isRecent = form.recent.checked;
            const isReverse = form.reverse.checked;

            let processAge = data.map((item) => ({ ...item, age: item.yearstart ? (new Date().getFullYear() - parseInt(item.yearstart)) : item.age }));
            let processType = processAge.filter((item) => (typeValue === 'all' || typeValue === item.type));
            let processSearch = processType.filter((item) => item.event.toLowerCase().includes(searchValue) || item.description.toLowerCase().includes(searchValue));
            let processSort = processSearch.sort((a, b) => isRecent ? a.age - b.age : b.age - a.age);
            let processDateReverse = processSort.map((item) => ({ ...item, age: isReverse ? 13800000000 - item.age : item.age }));
            let processTooltip = processDateReverse.map((item) => ({ ...item, tooltip: Array.from(form.units.options).slice(1).map(opt => `<div>${Number((item.age/opt.value).toFixed(2))} &mdash;&nbsp;</div><div>${opt.text.replace(/^./, (match) => match.toUpperCase())}</div>`).join('') }));
            let processUnit = processTooltip.map((item) => {
                if (unitValue) {
                    return {...item, age:  `${item.age / unitValue} ${unitText}` }
                } else {
                    const optionsArray = Array.from(form.units.options).slice(1);
                    let selectedOption = optionsArray[optionsArray.length - 1];
                    for (let option of optionsArray) {
                        if (parseInt(option.value) <= item.age) {
                            selectedOption = option;
                            break;
                        }
                    }
                    const divisor = parseInt(selectedOption.value);
                    const noUnits = selectedOption.text === 'years';
                    return {...item, age:  `${Number((item.age / divisor).toFixed(3))} ${noUnits ? 'years' : selectedOption.text}` };
                }
            });

            drawTable(processUnit);
        }

        function drawTable(tableData) {
                document.querySelector('tbody').innerHTML = '';
                tableData.forEach((item) => {
                    document.querySelector('tbody').insertAdjacentHTML('beforeend', `<tr>
                        <td>${item.type}</td>
                        <td>${item.event}</td>
                        <td class="tooltip"><span class="tooltiptext">${item.tooltip}</span>${item.age}</td>
                        <td>${item.yearstart || ''}</td>
                        <td>${item.yearend || ''}</td>
                        <td>${item.description}</td>
                    </tr>`);
                });
        }

        redraw(document.forms[0]);
    </script>
</body>
</html>
