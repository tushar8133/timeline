<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        header {
            position: fixed;
            top: 0;
            height: 30px;
        }
        main {
            position: fixed;
            top: 30px;
            height: calc(100% - 30px);
            width: 100%;
            background-color: #f0f0f0;
            overflow-y: scroll;
        }
    </style>
    <script src="data.js"></script>
</head>
<body>
    <header>
        <form onchange="redraw(this)">
            <input name="search" type="search" placeholder="search">
            <select name="units">
                <option value="0">Auto</option>
                <option value="1000000000">billions</option>
                <option value="10000000">crores</option>
                <option value="1000000">millions</option>
                <option value="100000">lakhs</option>
                <option value="1000">thousands</option>
                <option value="1">years</option>
            </select>
            <select name="eventtype">
                <option value="all">All Events</option>
            </select>
            <label>
                <input name="sort" type="radio" value="+1"> Ascending
            </label>
            <label>
                <input name="sort" type="radio" value="-1" checked> Descending
            </label>
        </form>
    </header>
    <main>
        <table border="1">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Event</th>
                    <th>Age</th>
                    <th>Year Start</th>
                    <th>Year End</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="5">Sources</a></td>
                </tr>
            </tfoot>
        </table>
    </main>
    <script>

        var eventTypes = [...new Set(data.map(item => item.type))];
        eventTypes.forEach(type => {
            document.querySelector('select[name="eventtype"]').insertAdjacentHTML('beforeend', `<option value="${type}">${type.charAt(0).toUpperCase() + type.slice(1)}</option>`);
        });
            

        function redraw(form) {
            const fData = new FormData(form);
            const fromEntries = Array.from(fData);
            const formObject = Object.fromEntries(fromEntries);
            console.log(formObject)
            const searchValue = form.search.value.toLowerCase();
            const unitValue = parseInt(form.units.value);
            const unitText = form.units.options[form.units.selectedIndex].text;
            const typeValue = form.eventtype.value;
            const sortValue = parseInt(form.sort.value);
            
            let processFillEmpty = data.map((item) => ({ ...item, age: item.yearstart ? (new Date().getFullYear() - parseInt(item.yearstart)) : item.age }));
            let processType = processFillEmpty.filter((item) => (typeValue === 'all' || typeValue === item.type));
            let processSort = processType.sort((a, b) => sortValue > 0 ? a.age - b.age : b.age - a.age);
            let processUnit = processSort.map((item) => {
                if (unitValue) {
                    return {...item, age:  `${item.age / unitValue} ${unitText.slice(0,2)}` }
                } else {
                    const optionsArray = Array.from(form.units.options).slice(1);
                    let selectedOption = optionsArray[optionsArray.length - 1];
                    for (let option of optionsArray) {
                        if (parseInt(option.value) <= item.age) {
                            selectedOption = option;
                            break;
                        }
                    }
                    const divisor = parseInt(selectedOption.value);
                    return {...item, age:  `${(item.age / divisor).toFixed(2)} ${selectedOption.text}` }
                }
            });

            drawTable(processUnit);
        }

        function drawTable(tableData) {
                document.querySelector('tbody').innerHTML = '';
                tableData.forEach((item) => {
                    document.querySelector('tbody').insertAdjacentHTML('beforeend', `<tr>
                        <td>${item.type}</td>
                        <td>${item.event}</td>
                        <td>${item.age}</td>
                        <td>${item.yearstart || ''}</td>
                        <td>${item.yearend || ''}</td>
                        <td>${item.description}</td>
                    </tr>`);
                });
        }

        drawTable(data);
    </script>
</body>
</html>
